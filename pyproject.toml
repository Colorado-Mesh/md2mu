[project]
name = "md2mu"
version = "1.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
]

[project.scripts]
md2mu = "md2mu:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--cov=md2mu", "--cov-report=term-missing"]
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
